{% extends "base.html" %}
{% block title %}Job Search Settings{% endblock %}
{% block body %}
<h1>Job-search settings</h1>
<form method="post" class="panel">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Job titles <input name="job_titles" value="{{ settings['job_titles'] }}"></label>
  <label>Acceptable locations <input name="acceptable_locations" value="{{ settings['acceptable_locations'] }}"></label>
  <label>Minimum pay <input name="minimum_pay" type="number" step="0.01" value="{{ settings['minimum_pay'] or '' }}"></label>
  <label>Employment types <input name="employment_types" value="{{ settings['employment_types'] }}"></label>
  <label>Search keywords <input name="search_keywords" value="{{ settings['search_keywords'] }}"></label>
  <label><input name="remote_ok" type="checkbox" value="1" {% if settings['remote_ok'] %}checked{% endif %}> Remote jobs are okay</label>
  <button type="submit">Save search settings</button>
</form>
{% endblock %}
