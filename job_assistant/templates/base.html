<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Assistant{% endblock %}</title>
  <style>
    :root { color-scheme: light; --bg:#f6f8f7; --panel:#fff; --text:#111814; --muted:#53615a; --line:#9aa8a0; --brand:#145c48; --danger:#9d1c1c; --ok:#145c48; --warn:#7b5b00; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: {% if g.settings and g.settings['large_text'] %}20px{% else %}17px{% endif %}; line-height:1.5; background:var(--bg); color:var(--text); }
    a { color:#064f8a; font-weight:700; }
    a:focus, button:focus, input:focus, textarea:focus, select:focus { outline:4px solid #f6c453; outline-offset:2px; }
    header { background:#0f241d; color:white; padding:14px 18px; }
    header a { color:white; margin-right:14px; display:inline-block; padding:8px 0; }
    main { max-width:1120px; margin:0 auto; padding:24px 18px 48px; }
    h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin:0 0 16px; }
    h2 { font-size:1.35rem; margin-top:28px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap:16px; }
    .card, form.panel, .panel { background:var(--panel); border:2px solid var(--line); border-radius:8px; padding:16px; margin:14px 0; }
    label { display:block; font-weight:800; margin-top:14px; }
    input, textarea, select, button { width:100%; font:inherit; padding:12px; border:2px solid #39463f; border-radius:6px; background:white; color:var(--text); }
    textarea { min-height:110px; }
    button, .button { background:var(--brand); color:white; font-weight:900; border:2px solid var(--brand); border-radius:6px; padding:12px; cursor:pointer; text-align:center; text-decoration:none; display:inline-block; }
    button.secondary, .button.secondary { background:white; color:var(--brand); }
    button.danger { background:var(--danger); border-color:var(--danger); }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    .actions > * { flex:1 1 180px; }
    .flash { border:2px solid var(--warn); background:#fff6d8; padding:12px; border-radius:8px; margin:12px 0; }
    .flash.success { border-color:var(--ok); background:#e7f5ee; }
    .flash.error { border-color:var(--danger); background:#fde8e8; }
    .status { display:inline-block; padding:4px 8px; border-radius:6px; border:2px solid var(--line); font-weight:800; background:#eef3f0; }
    .muted { color:var(--muted); }
    table { width:100%; border-collapse:collapse; background:white; }
    th, td { border:1px solid var(--line); padding:10px; text-align:left; vertical-align:top; }
    th { background:#e9efec; }
    @media (max-width: 680px) {
      header nav { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; }
      .actions { display:block; }
      .actions > * { margin-top:10px; }
      table, thead, tbody, tr, th, td { display:block; }
      th { display:none; }
      td { border-top:0; }
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      {% if g.user %}
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('profile') }}">Profile</a>
        <a href="{{ url_for('credentials') }}">Credentials</a>
        <a href="{{ url_for('resume_upload') }}">Resume</a>
        <a href="{{ url_for('job_search_settings') }}">Search Settings</a>
        <a href="{{ url_for('job_feed') }}">Job Feed</a>
        <a href="{{ url_for('review_queue') }}">Review Queue</a>
        <a href="{{ url_for('application_history') }}">History</a>
        <a href="{{ url_for('settings') }}">Settings</a>
        <form method="post" action="{{ url_for('signout') }}" style="display:inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="secondary">Sign out</button>
        </form>
      {% endif %}
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash {{ category }}">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
  </main>
</body>
</html>
