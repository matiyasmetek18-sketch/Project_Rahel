{% extends "base.html" %}
{% block title %}Credentials{% endblock %}
{% block body %}
<h1>Credentials</h1>
<form method="post" class="panel">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Name <input name="name" required></label>
  <label>Issuing body <input name="issuing_body" required></label>
  <label>Expiration date <input name="expiration_date" type="date"></label>
  <label><input name="verified" type="checkbox" value="1"> I checked the official record</label>
  <button type="submit">Add credential</button>
</form>
<h2>Saved credentials</h2>
{% for credential in credentials %}
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="credential_id" value="{{ credential['id'] }}">
  <label>Name <input name="name" value="{{ credential['name'] }}" required></label>
  <label>Issuing body <input name="issuing_body" value="{{ credential['issuing_body'] }}" required></label>
  <label>Expiration date <input name="expiration_date" type="date" value="{{ credential['expiration_date'] or '' }}"></label>
  <label><input name="verified" type="checkbox" value="1" {% if credential['verified'] %}checked{% endif %}> Verified after official check</label>
  <button type="submit">Update credential</button>
</form>
{% else %}
<p>No credentials saved.</p>
{% endfor %}
{% endblock %}
