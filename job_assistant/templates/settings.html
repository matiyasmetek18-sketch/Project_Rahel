{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block body %}
<h1>Settings</h1>
<form method="post" class="panel">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Default daily limit per site <input name="default_daily_limit" type="number" min="1" max="50" value="{{ settings['default_daily_limit'] }}"></label>
  <label><input name="pause_all" type="checkbox" value="1" {% if settings['pause_all'] %}checked{% endif %}> Pause all application opening</label>
  <label><input name="high_contrast" type="checkbox" value="1" {% if settings['high_contrast'] %}checked{% endif %}> High contrast</label>
  <label><input name="large_text" type="checkbox" value="1" {% if settings['large_text'] %}checked{% endif %}> Large text</label>
  <button type="submit">Save settings</button>
</form>
{% endblock %}
